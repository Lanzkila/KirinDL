name: Dispatch Stable Test Now

on:
  push:
    branches:
      - main
    paths:
      - '.kirin-stable-test-trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Stable Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/kirindl-stable-test.yml/dispatches" \
            -f ref=main
