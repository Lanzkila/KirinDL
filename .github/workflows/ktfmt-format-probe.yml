name: KtFmt Script Format Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/ktfmt-format-probe.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Format Gradle Kotlin scripts and print the exact diff
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:ktfmtFormatScripts --stacktrace --no-daemon --no-configuration-cache
          git diff -- app/build.gradle.kts
