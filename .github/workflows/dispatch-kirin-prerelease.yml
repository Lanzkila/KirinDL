name: Dispatch Kirin Pre-Release Test

on:
  push:
    branches:
      - main
    paths:
      - '.kirin-prerelease-dispatch'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch manual Kirin Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/kirin-build-test.yml/dispatches" \
            -f ref=main \
            -f 'inputs[dev_tag]=v3.1.8-devpatch19'
