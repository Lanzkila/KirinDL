name: Cancel Pending Stable Test

on:
  push:
    branches:
      - main
    paths:
      - '.kirin-cancel-pending-stable-test'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate pending Stable Test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 36970321003 --repo "$GITHUB_REPOSITORY"
