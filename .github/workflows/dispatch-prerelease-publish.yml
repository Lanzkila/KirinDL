name: Dispatch Pre-Release Publish

on:
  push:
    branches:
      - main
    paths:
      - '.kirin-prerelease-publish-trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch devpatch23 artifact publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-kirin-prerelease-artifact.yml/dispatches" \
            -f ref=main \
            -f 'inputs[artifact_run_id]=36822360925' \
            -f 'inputs[artifact_name]=KirinDL-Pre-Release-v3.1.8-devpatch23-118' \
            -f 'inputs[source_run_number]=118' \
            -f 'inputs[dev_tag]=v3.1.8-devpatch23'
