name: KirinDL Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after the signed build succeeds"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: kirindl-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Resolve KirinDL version
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          text = Path("buildSrc/src/main/kotlin/Version.kt").read_text(encoding="utf-8")
          match = re.search(
              r"Version\.(?:Stable|Alpha|Beta|ReleaseCandidate)\("
              r"\s*versionMajor\s*=\s*(\d+),"
              r"\s*versionMinor\s*=\s*(\d+),"
              r"\s*versionPatch\s*=\s*(\d+)",
              text,
              re.S,
          )

          if not match:
              raise SystemExit("Could not resolve currentVersion from Version.kt")

          version = ".".join(match.groups())
          release_notes_path = f"release-notes/v{version}.md"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"release_notes_path={release_notes_path}\n")

          print(f"KirinDL version: {version}")
          print(f"Release notes: {release_notes_path}")

      - name: Validate release notes
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! -f "$RELEASE_NOTES_PATH" ]]; then
            echo "::error::Missing release notes: $RELEASE_NOTES_PATH"
            echo "::error::Create release-notes/v$RELEASE_VERSION.md before publishing."
            exit 1
          fi

          if [[ ! -s "$RELEASE_NOTES_PATH" ]]; then
            echo "::error::Release notes file is empty: $RELEASE_NOTES_PATH"
            exit 1
          fi

          if ! grep -Fq "KirinDL v$RELEASE_VERSION" "$RELEASE_NOTES_PATH"; then
            echo "::error::$RELEASE_NOTES_PATH does not contain the expected version heading: KirinDL v$RELEASE_VERSION"
            exit 1
          fi

          echo "Release notes validated: $RELEASE_NOTES_PATH"

      - name: Prepare KirinDL release signing
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KIRIN_KEYSTORE_BASE64 KIRIN_KEYSTORE_PASSWORD KIRIN_KEY_ALIAS KIRIN_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done

          printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/kirin-release.jks"

          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n'             "$KIRIN_KEY_ALIAS" "$KIRIN_KEY_PASSWORD" "$KIRIN_KEYSTORE_PASSWORD"             > "$GITHUB_WORKSPACE/keystore.properties"

          keytool -list             -keystore "$GITHUB_WORKSPACE/kirin-release.jks"             -storepass "$KIRIN_KEYSTORE_PASSWORD"             -alias "$KIRIN_KEY_ALIAS" >/dev/null

      - name: Build signed Universal Release
        run: ./gradlew assembleGenericRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare Universal Release artifact
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/generic/release -type f -name '*universal*.apk' | head -n 1)"
          [[ -n "$RELEASE_APK" ]] || { echo "::error::Universal release APK was not generated."; exit 1; }
          mkdir -p artifacts/release
          cp "$RELEASE_APK" artifacts/release/KirinDL-Universal-Release.apk

      - name: Verify Universal Release signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs             artifacts/release/KirinDL-Universal-Release.apk

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          sha256sum KirinDL-Universal-Release.apk > KirinDL-Universal-Release.apk.sha256
          cat KirinDL-Universal-Release.apk.sha256

      - name: Upload signed Universal Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirinDL-Universal-Release-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: |
            artifacts/release/KirinDL-Universal-Release.apk
            artifacts/release/KirinDL-Universal-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KirinDL v${{ steps.version.outputs.version }}
          body_path: ${{ steps.version.outputs.release_notes_path }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/release/KirinDL-Universal-Release.apk
            artifacts/release/KirinDL-Universal-Release.apk.sha256

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/kirin-release.jks"
          rm -f "$GITHUB_WORKSPACE/keystore.properties"
