name: KirinDL Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the resolved KirinDL release after the signed build succeeds"
        required: true
        default: false
        type: boolean
      release_channel:
        description: "Release channel used for manual workflow runs"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - prerelease
  push:
    branches:
      - main
    paths:
      - '.kirin-release-trigger'
      - '.kirin-prerelease-trigger'

permissions:
  contents: write

concurrency:
  group: kirindl-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Resolve release channel
        id: channel
        shell: python
        env:
          INPUT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          import os
          import subprocess

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          channel = (os.environ.get("INPUT_RELEASE_CHANNEL") or "stable").strip().lower()

          if event_name == "push":
              changed = set(
                  subprocess.check_output(
                      ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"]],
                      text=True,
                  ).splitlines()
              )
              stable_trigger = ".kirin-release-trigger" in changed
              prerelease_trigger = ".kirin-prerelease-trigger" in changed

              if stable_trigger and prerelease_trigger:
                  raise SystemExit("Stable and Pre-release trigger files changed in the same push")
              if prerelease_trigger:
                  channel = "prerelease"
              elif stable_trigger:
                  channel = "stable"

          if channel not in {"stable", "prerelease"}:
              raise SystemExit(f"Unsupported release channel: {channel}")

          prerelease = channel == "prerelease"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"channel={channel}\n")
              out.write(f"prerelease={'true' if prerelease else 'false'}\n")
              out.write(f"make_latest={'false' if prerelease else 'true'}\n")

          print(f"KirinDL release channel: {channel}")

      - name: Resolve next release version
        id: version
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases?per_page=100"],
              text=True,
          )
          releases = json.loads(raw)

          release_re = re.compile(r"^v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$")
          channel = os.environ["RELEASE_CHANNEL"]
          published = []
          for release in releases:
              if release.get("draft"):
                  continue
              match = release_re.fullmatch(release.get("tag_name", ""))
              if not match:
                  continue
              major, minor, patch = map(int, match.groups()[:3])
              build = int(match.group(4) or 0)
              published.append(
                  {
                      "version": (major, minor, patch, build),
                      "id": release.get("id"),
                      "prerelease": bool(release.get("prerelease")),
                      "tag": release.get("tag_name", ""),
                  }
              )

          text = Path("buildSrc/src/main/kotlin/Version.kt").read_text(encoding="utf-8")
          match = re.search(
              r"Version\.Stable\(\s*versionMajor\s*=\s*(\d+),"
              r"\s*versionMinor\s*=\s*(\d+),"
              r"\s*versionPatch\s*=\s*(\d+)"
              r"(?:,\s*versionBuild\s*=\s*(\d+))?\s*\)",
              text,
              re.S,
          )
          if not match:
              raise SystemExit("Could not resolve the KirinDL source version")
          source_major, source_minor, source_patch = map(int, match.groups()[:3])
          source_build = int(match.group(4) or 0)
          source_version = (source_major, source_minor, source_patch, source_build)

          # If the exact source version already exists in the opposite channel, switch
          # only the GitHub release metadata. Never rebuild or replace APK assets under the
          # same Android versionCode.
          promote_release = None
          demote_release = None
          fallback_stable_release = None

          if channel == "stable":
              promote_release = next(
                  (
                      release
                      for release in published
                      if release["version"] == source_version and release["prerelease"]
                  ),
                  None,
              )
          else:
              demote_release = next(
                  (
                      release
                      for release in published
                      if release["version"] == source_version and not release["prerelease"]
                  ),
                  None,
              )
              if demote_release is not None:
                  stable_candidates = [
                      release
                      for release in published
                      if not release["prerelease"] and release["version"] < source_version
                  ]
                  fallback_stable_release = (
                      max(stable_candidates, key=lambda item: item["version"])
                      if stable_candidates
                      else None
                  )

          promote_only = promote_release is not None
          demote_only = demote_release is not None
          metadata_only = promote_only or demote_only
          transition_release = promote_release or demote_release
          release_id = str(transition_release["id"]) if transition_release else ""
          fallback_stable_release_id = (
              str(fallback_stable_release["id"]) if fallback_stable_release else ""
          )

          if metadata_only:
              major, minor, patch, build = source_version
          else:
              # Both channels consider every published numeric release. This guarantees
              # that a newly built Stable remains newer than every earlier Pre-release.
              published_versions = [release["version"] for release in published]
              if published_versions:
                  latest_version = max(published_versions)
                  if source_version > latest_version:
                      major, minor, patch, build = source_version
                  else:
                      major, minor, patch, build = latest_version
                      build += 1
              else:
                  major, minor, patch, build = source_version

          version = (
              f"{major}.{minor}.{patch}.{build}"
              if build > 0
              else f"{major}.{minor}.{patch}"
          )
          version_code = (
              major * 100_000_000
              + minor * 1_000_000
              + patch * 10_000
              + build * 10
              + 400
          )
          release_notes_path = f"release-notes/v{version}.md"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"version_code={version_code}\n")
              out.write(f"release_notes_path={release_notes_path}\n")
              out.write(f"promote_only={'true' if promote_only else 'false'}\n")
              out.write(f"demote_only={'true' if demote_only else 'false'}\n")
              out.write(f"metadata_only={'true' if metadata_only else 'false'}\n")
              out.write(f"release_id={release_id}\n")
              out.write(f"fallback_stable_release_id={fallback_stable_release_id}\n")

          if promote_only:
              print(
                  f"Promote existing KirinDL Pre-release v{version} to Stable "
                  f"(release id {release_id}); APK rebuild will be skipped."
              )
          elif demote_only:
              print(
                  f"Move existing KirinDL Stable v{version} back to Pre-release "
                  f"(release id {release_id}); APK rebuild will be skipped."
              )
          else:
              print(f"Next KirinDL {channel}: v{version}")
              print(f"Version code: {version_code}")
              print(f"Release notes: {release_notes_path}")

      - name: Stage generated version
        if: ${{ steps.version.outputs.metadata_only != 'true' }}
        shell: python
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          import os
          import re
          from pathlib import Path

          parts = os.environ["RELEASE_VERSION"].split(".")
          if len(parts) not in (3, 4):
              raise SystemExit("KirinDL version must have three or four numeric components")
          major, minor, patch = parts[:3]
          build = parts[3] if len(parts) == 4 else "0"
          version_code = os.environ["VERSION_CODE"]

          version_file = Path("buildSrc/src/main/kotlin/Version.kt")
          text = version_file.read_text(encoding="utf-8")
          text, count = re.subn(
              r"Version\.Stable\(\s*versionMajor\s*=\s*\d+,\s*versionMinor\s*=\s*\d+,"
              r"\s*versionPatch\s*=\s*\d+(?:,\s*versionBuild\s*=\s*\d+)?\s*\)",
              (
                  f"Version.Stable(versionMajor = {major}, versionMinor = {minor}, "
                  f"versionPatch = {patch}, versionBuild = {build})"
              ),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to stage Version.kt")
          version_file.write_text(text, encoding="utf-8")

          gradle_file = Path("app/build.gradle.kts")
          gradle = gradle_file.read_text(encoding="utf-8")
          gradle, count = re.subn(
              r"versionCode\s*=\s*[0-9_]+",
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to stage app versionCode")
          gradle_file.write_text(gradle, encoding="utf-8")

          print(f"Staged stable version {os.environ['RELEASE_VERSION']} ({version_code})")

      - name: Prepare Pre-release notes from new commits
        id: prerelease_notes
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && steps.channel.outputs.channel == 'prerelease' && steps.version.outputs.metadata_only != 'true' }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["RELEASE_VERSION"]
          target_tag = f"v{version}"
          version_re = re.compile(r"^v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$")

          def parse_version(tag):
              match = version_re.fullmatch(tag or "")
              if not match:
                  return None
              major, minor, patch = map(int, match.groups()[:3])
              build = int(match.group(4) or 0)
              return (major, minor, patch, build)

          target_version = parse_version(target_tag)
          if target_version is None:
              raise SystemExit(f"Unsupported KirinDL release version: {target_tag}")

          releases = json.loads(
              subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases?per_page=100"],
                  text=True,
              )
          )

          # Chain each Pre-release from the most recent published numeric release:
          # Stable -> .1, .1 -> .2, .2 -> .3, and so on.
          previous = []
          for release in releases:
              if release.get("draft"):
                  continue
              tag = release.get("tag_name", "")
              parsed = parse_version(tag)
              if parsed is None or parsed >= target_version:
                  continue
              previous.append((parsed, tag))

          previous_tag = max(previous, default=(None, None))[1]

          ignored_subject_prefixes = (
              "chore(changelog):",
              "Trigger Kirin pre-release",
              "Trigger pre-release",
              "Trigger yt-dlp",
              "Trigger devpatch",
              "Trigger ARM64",
              "Run Kirin pre-release",
              "Trigger KirinDL v",
              "Remove temporary",
              "Restore manual",
              "Temporary trigger",
              "Temporary CI",
          )
          ignored_only_paths = {
              ".kirin-prerelease-trigger",
              ".kirin-release-trigger",
              ".github/workflows/android.yml",
              ".github/workflows/auto-changelog.yml",
              "CHANGELOG.md",
              "release-notes/README.md",
          }

          rev_range = f"{previous_tag}..HEAD" if previous_tag else "HEAD"
          raw = subprocess.check_output(
              [
                  "git",
                  "log",
                  rev_range,
                  "--no-merges",
                  "--date=short",
                  "--pretty=format:%H%x1f%h%x1f%ad%x1f%s",
              ],
              text=True,
          )

          changes = []
          for line in raw.splitlines():
              if not line.strip():
                  continue
              full_sha, short_sha, day, subject = line.split("\x1f", 3)
              if subject.startswith(ignored_subject_prefixes):
                  continue

              changed_paths = subprocess.check_output(
                  [
                      "git",
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      full_sha,
                  ],
                  text=True,
              ).splitlines()

              if changed_paths and set(changed_paths).issubset(ignored_only_paths):
                  continue

              changes.append((day, short_sha, subject))

          previous_label = previous_tag or "repository start"
          lines = [
              f"# KirinDL v{version}",
              "",
              "### Pre-release testing build",
              "",
              f"## Changes since {previous_label}",
              "",
          ]
          if changes:
              for day, short_sha, subject in changes:
                  lines.append(f"- {subject} (`{short_sha}`, {day})")
          else:
              lines.append("- No additional user-facing source changes were detected.")

          notes_path = Path(os.environ["RUNNER_TEMP"]) / "kirindl-prerelease-notes.md"
          notes_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"path={notes_path}\n")

          print(f"Pre-release baseline: {previous_label}")
          print(f"Included new commits: {len(changes)}")
          print(f"Prepared notes: {notes_path}")

      - name: Validate Stable release notes
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && steps.channel.outputs.channel == 'stable' && steps.version.outputs.demote_only != 'true' }}
        shell: bash
        env:
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ -s "$RELEASE_NOTES_PATH" ]] || {
            echo "::error::Stable release notes are missing or empty: $RELEASE_NOTES_PATH"
            echo "::error::Stable releases must use release-notes/v$RELEASE_VERSION.md"
            exit 1
          }
          grep -Fq "KirinDL v$RELEASE_VERSION" "$RELEASE_NOTES_PATH" || {
            echo "::error::$RELEASE_NOTES_PATH does not contain the expected KirinDL v$RELEASE_VERSION heading."
            exit 1
          }
          echo "Stable release notes validated: $RELEASE_NOTES_PATH"

      - name: Validate Pre-release notes
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && steps.channel.outputs.channel == 'prerelease' && steps.version.outputs.metadata_only != 'true' }}
        shell: bash
        env:
          PRE_RELEASE_NOTES_PATH: ${{ steps.prerelease_notes.outputs.path }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ -s "$PRE_RELEASE_NOTES_PATH" ]] || {
            echo "::error::Generated Pre-release notes are missing or empty."
            exit 1
          }
          grep -Fq "KirinDL v$RELEASE_VERSION" "$PRE_RELEASE_NOTES_PATH" || {
            echo "::error::Generated Pre-release notes do not contain KirinDL v$RELEASE_VERSION."
            exit 1
          }
          echo "Pre-release notes validated: $PRE_RELEASE_NOTES_PATH"

      - name: Prepare KirinDL release signing
        if: ${{ steps.version.outputs.metadata_only != 'true' }}
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KIRIN_KEYSTORE_BASE64 KIRIN_KEYSTORE_PASSWORD KIRIN_KEY_ALIAS KIRIN_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done

          printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/kirin-release.jks"
          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n' \
            "$KIRIN_KEY_ALIAS" "$KIRIN_KEY_PASSWORD" "$KIRIN_KEYSTORE_PASSWORD" \
            > "$GITHUB_WORKSPACE/keystore.properties"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/kirin-release.jks" \
            -storepass "$KIRIN_KEYSTORE_PASSWORD" \
            -alias "$KIRIN_KEY_ALIAS" >/dev/null

      - name: Build signed Release APKs
        if: ${{ steps.version.outputs.metadata_only != 'true' }}
        run: ./gradlew assembleGenericRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Verify all Release APKs and create checksums
        if: ${{ steps.version.outputs.metadata_only != 'true' }}
        id: assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/generic/release"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          REQUIRED_APKS=(
            "KirinDL-${RELEASE_VERSION}-universal.apk"
            "KirinDL-${RELEASE_VERSION}-arm64-v8a.apk"
            "KirinDL-${RELEASE_VERSION}-armeabi-v7a.apk"
            "KirinDL-${RELEASE_VERSION}-x86.apk"
            "KirinDL-${RELEASE_VERSION}-x86_64.apk"
          )

          for NAME in "${REQUIRED_APKS[@]}"; do
            APK="$APK_DIR/$NAME"
            [[ -f "$APK" ]] || {
              echo "::error::Missing Release APK: $NAME"
              exit 1
            }

            BADGING="$("$AAPT" dump badging "$APK")"
            PACKAGE_ID="$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"

            [[ "$PACKAGE_ID" == "com.kirin.downloader" ]] || {
              echo "::error::Wrong package id in $APK: '$PACKAGE_ID'"
              exit 1
            }
            [[ "$VERSION_NAME" == "$RELEASE_VERSION" ]] || {
              echo "::error::Wrong version name in $APK: '$VERSION_NAME'. Expected '$RELEASE_VERSION'"
              exit 1
            }

            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

          (
            cd "$APK_DIR"
            sha256sum "${REQUIRED_APKS[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"
          echo "Verified Universal, ARM64-v8a, ARMv7, x86 and x86_64 Release APKs."

      - name: Upload signed Release artifacts
        if: ${{ steps.version.outputs.metadata_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: KirinDL-${{ steps.channel.outputs.channel }}-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-universal.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-arm64-v8a.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-x86.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-x86_64.apk
            ${{ steps.assets.outputs.apk_dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Move Stable release back to Pre-release
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && steps.version.outputs.demote_only == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.version.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          FALLBACK_STABLE_RELEASE_ID: ${{ steps.version.outputs.fallback_stable_release_id }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_ID" ]] || {
            echo "::error::Pre-release transition requested without an existing GitHub release id."
            exit 1
          }
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=true \
            -f make_latest=false >/dev/null

          if [[ -n "$FALLBACK_STABLE_RELEASE_ID" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$FALLBACK_STABLE_RELEASE_ID" \
              -f make_latest=true >/dev/null
          fi

          echo "Moved KirinDL v$RELEASE_VERSION back to Pre-release without rebuilding APKs."

      - name: Promote tested Pre-release to Stable
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && steps.version.outputs.promote_only == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.version.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ steps.version.outputs.release_notes_path }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_ID" ]] || {
            echo "::error::Promotion requested without an existing GitHub release id."
            exit 1
          }
          RELEASE_BODY="$(cat "$RELEASE_NOTES_PATH")"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=false \
            -f make_latest=true \
            -f body="$RELEASE_BODY" >/dev/null
          echo "Promoted KirinDL v$RELEASE_VERSION from Pre-release to Stable without rebuilding APKs."
          echo "Stable notes loaded from $RELEASE_NOTES_PATH."

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'push' || inputs.publish_release) && steps.version.outputs.metadata_only != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KirinDL v${{ steps.version.outputs.version }}
          body_path: ${{ steps.channel.outputs.channel == 'prerelease' && steps.prerelease_notes.outputs.path || steps.version.outputs.release_notes_path }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-universal.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-arm64-v8a.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-x86.apk
            ${{ steps.assets.outputs.apk_dir }}/KirinDL-${{ steps.version.outputs.version }}-x86_64.apk
            ${{ steps.assets.outputs.apk_dir }}/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/kirin-release.jks"
          rm -f "$GITHUB_WORKSPACE/keystore.properties"
