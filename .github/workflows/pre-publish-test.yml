name: KirinDL Pre-publish Tests

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "buildSrc/**"
      - "color/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pre-publish-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "buildSrc/**"
      - "color/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pre-publish-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kirindl-prepublish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile, unit test and build Release
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Align local versionCode with Version.kt (test workspace only)
        shell: python
        run: |
          import re
          from pathlib import Path

          version_source = Path("buildSrc/src/main/kotlin/Version.kt").read_text(encoding="utf-8")
          match = re.search(
              r"Version\\.Stable\\(\\s*versionMajor\\s*=\\s*(\\d+),"
              r"\\s*versionMinor\\s*=\\s*(\\d+),"
              r"\\s*versionPatch\\s*=\\s*(\\d+)"
              r"(?:,\\s*versionBuild\\s*=\\s*(\\d+))?\\s*\\)",
              version_source,
              re.S,
          )
          if not match:
              raise SystemExit("Could not read Version.Stable from Version.kt")

          major, minor, patch = map(int, match.groups()[:3])
          build = int(match.group(4) or 0)
          version_code = (
              major * 100_000_000
              + minor * 1_000_000
              + patch * 10_000
              + build * 10
              + 400
          )

          gradle_file = Path("app/build.gradle.kts")
          gradle_source = gradle_file.read_text(encoding="utf-8")
          gradle_source, count = re.subn(
              r"versionCode\\s*=\\s*[0-9_]+",
              f"versionCode = {version_code}",
              gradle_source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not stage app versionCode for test build")

          gradle_file.write_text(gradle_source, encoding="utf-8")
          print(
              f"Test workspace only: Version.kt {major}.{minor}.{patch}.{build} "
              f"uses versionCode {version_code}"
          )

      - name: Compile Generic Release sources
        run: |
          ./gradlew \
            :app:compileGenericReleaseKotlin \
            :app:compileGenericReleaseUnitTestKotlin \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Run fast local unit tests
        run: |
          ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false \
            :app:testGenericReleaseUnitTest \
            --tests com.junkfood.seal.util.AppUpdateAssetSelectionTest \
            --tests com.junkfood.seal.util.NetscapeCookieParserTest \
            --tests com.junkfood.seal.ExampleUnitTest \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Build Generic Release APKs (unsigned)
        run: |
          ./gradlew assembleGenericRelease \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Verify Release APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/generic/release"
          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$APK_COUNT" -lt 1 ]]; then
            echo "::error::Generic Release APK output was not generated."
            exit 1
          fi
          echo "Generic Release build produced $APK_COUNT APK file(s)."
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f\n'

      - name: Report test-only result
        if: success()
        run: |
          echo "Pre-publish checks passed."
          echo "No version was changed, no APK was signed or uploaded, and no GitHub Release was published."
