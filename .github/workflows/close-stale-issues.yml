name: KirinDL Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark inactive discussions as stale
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 90 days. It will be closed after another
            30 days without activity. Comment if it is still relevant.
          close-issue-message: >
            Closing this issue after the stale period. It can be reopened if the problem
            is still relevant to KirinDL.
          stale-pr-message: >
            This pull request has had no activity for 90 days. It will be closed after
            another 30 days without activity.
          close-pr-message: >
            Closing this pull request after the stale period. A new PR can be opened when
            the work is ready to continue.
          exempt-issue-labels: pinned,security,keep-open
          exempt-pr-labels: pinned,security,keep-open
