name: Dispatch Stable Test

on:
  push:
    branches:
      - main
    paths:
      - 'release-notes/stable-test-trigger.md'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch KirinDL stable test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches" \
            -f ref=main \
            -f 'inputs[publish_release]=false'
