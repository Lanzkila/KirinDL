name: Dispatch Stable Test

on:
  push:
    branches:
      - main
    paths:
      - '.kirin-stable-test-trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable artifact build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/dispatches" \
            -f ref=main \
            -F 'inputs[publish_release]=false'
