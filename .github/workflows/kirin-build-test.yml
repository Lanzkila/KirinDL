name: Kirin Pre-Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/.kirin-prerelease-trigger'

permissions:
  contents: write

concurrency:
  group: kirindl-pre-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Kirin Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Resolve next Pre-Release patch
        id: version
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases?per_page=100"],
              text=True,
          )
          releases = json.loads(raw)

          stable_re = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          stable_versions = []
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              match = stable_re.fullmatch(release.get("tag_name", ""))
              if match:
                  stable_versions.append(tuple(map(int, match.groups())))

          if stable_versions:
              major, minor, patch = max(stable_versions)
          else:
              text = Path("buildSrc/src/main/kotlin/Version.kt").read_text(encoding="utf-8")
              match = re.search(
                  r"Version\.Stable\(\s*versionMajor\s*=\s*(\d+),"
                  r"\s*versionMinor\s*=\s*(\d+),"
                  r"\s*versionPatch\s*=\s*(\d+)\s*\)",
                  text,
                  re.S,
              )
              if not match:
                  raise SystemExit("Could not resolve a stable KirinDL base version")
              major, minor, patch = map(int, match.groups())

          next_patch = patch + 1
          base_version = f"{major}.{minor}.{next_patch}"
          dev_re = re.compile(rf"^v{re.escape(base_version)}-devpatch(\d+)$")
          dev_numbers = []
          for release in releases:
              if release.get("draft"):
                  continue
              match = dev_re.fullmatch(release.get("tag_name", ""))
              if match:
                  dev_numbers.append(int(match.group(1)))

          dev_patch = max(dev_numbers, default=0) + 1
          dev_tag = f"v{base_version}-devpatch{dev_patch}"
          version_code = major * 100_000_000 + minor * 1_000_000 + next_patch * 10_000 + 400

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"base_version={base_version}\n")
              out.write(f"dev_patch={dev_patch}\n")
              out.write(f"dev_tag={dev_tag}\n")
              out.write(f"version_code={version_code}\n")

          print(f"Next Kirin Pre-Release: {dev_tag}")
          print(f"Version code: {version_code}")

      - name: Stage generated version
        shell: python
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          import os
          import re
          from pathlib import Path

          major, minor, patch = os.environ["BASE_VERSION"].split(".")
          version_code = os.environ["VERSION_CODE"]

          version_file = Path("buildSrc/src/main/kotlin/Version.kt")
          text = version_file.read_text(encoding="utf-8")
          text, count = re.subn(
              r"Version\.Stable\(\s*versionMajor\s*=\s*\d+,\s*versionMinor\s*=\s*\d+,\s*versionPatch\s*=\s*\d+\s*\)",
              f"Version.Stable(versionMajor = {major}, versionMinor = {minor}, versionPatch = {patch})",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to stage Version.kt")
          version_file.write_text(text, encoding="utf-8")

          gradle_file = Path("app/build.gradle.kts")
          gradle = gradle_file.read_text(encoding="utf-8")
          gradle, count = re.subn(
              r"versionCode\s*=\s*[0-9_]+",
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to stage app versionCode")
          gradle_file.write_text(gradle, encoding="utf-8")

          print(f"Staged app base version {os.environ['BASE_VERSION']} ({version_code})")

      - name: Prepare KirinDL release signing
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KIRIN_KEYSTORE_BASE64 KIRIN_KEYSTORE_PASSWORD KIRIN_KEY_ALIAS KIRIN_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done

          printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/kirin-release.jks"

          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n' \
            "$KIRIN_KEY_ALIAS" "$KIRIN_KEY_PASSWORD" "$KIRIN_KEYSTORE_PASSWORD" \
            > "$GITHUB_WORKSPACE/keystore.properties"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/kirin-release.jks" \
            -storepass "$KIRIN_KEYSTORE_PASSWORD" \
            -alias "$KIRIN_KEY_ALIAS" >/dev/null

          echo "KirinDL release keystore is valid."

      - name: Build signed Kirin Pre-Release
        shell: bash
        env:
          DEV_PATCH: ${{ steps.version.outputs.dev_patch }}
        run: |
          set -euo pipefail
          ./gradlew assembleGenericPrerelease \
            "-PkirinPrereleaseSuffix=-devpatch${DEV_PATCH}" \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare Universal and ARM64 Pre-Release APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/generic/prerelease"
          UNIVERSAL_APK="$(find "$APK_DIR" -type f -name '*universal*.apk' | head -n 1)"
          ARM64_APK="$(find "$APK_DIR" -type f -name '*arm64-v8a*.apk' | head -n 1)"

          [[ -n "$UNIVERSAL_APK" ]] || {
            echo "::error::Universal Kirin Pre-Release APK was not generated."
            exit 1
          }
          [[ -n "$ARM64_APK" ]] || {
            echo "::error::ARM64-v8a Kirin Pre-Release APK was not generated."
            exit 1
          }

          mkdir -p artifacts/prerelease
          cp "$UNIVERSAL_APK" artifacts/prerelease/KirinDL-Universal-Pre-Release.apk
          cp "$ARM64_APK" artifacts/prerelease/KirinDL-ARM64-Pre-Release.apk

          ls -lh artifacts/prerelease/

      - name: Verify package identity and signatures
        shell: bash
        env:
          DEV_TAG: ${{ steps.version.outputs.dev_tag }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          EXPECTED_VERSION="${DEV_TAG#v}"

          for APK in \
            artifacts/prerelease/KirinDL-Universal-Pre-Release.apk \
            artifacts/prerelease/KirinDL-ARM64-Pre-Release.apk
          do
            BADGING="$("$AAPT" dump badging "$APK")"
            PACKAGE_ID="$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            APP_LABEL="$(printf '%s\n' "$BADGING" | sed -n "s/application-label:'\([^']*\)'.*/\1/p" | head -n 1)"

            [[ "$PACKAGE_ID" == "com.kirin.downloader.prerelease" ]] || {
              echo "::error::Wrong package id in $APK: '$PACKAGE_ID'"
              exit 1
            }
            [[ "$VERSION_NAME" == "$EXPECTED_VERSION" ]] || {
              echo "::error::Wrong version name in $APK: '$VERSION_NAME'. Expected '$EXPECTED_VERSION'"
              exit 1
            }
            [[ "$APP_LABEL" == "Kirin Pre-Release" ]] || {
              echo "::error::Wrong app label in $APK: '$APP_LABEL'"
              exit 1
            }

            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

          echo "Verified Universal + ARM64 Pre-Release APKs."

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/prerelease
          sha256sum KirinDL-Universal-Pre-Release.apk > KirinDL-Universal-Pre-Release.apk.sha256
          sha256sum KirinDL-ARM64-Pre-Release.apk > KirinDL-ARM64-Pre-Release.apk.sha256
          cat KirinDL-Universal-Pre-Release.apk.sha256
          cat KirinDL-ARM64-Pre-Release.apk.sha256

      - name: Upload Kirin Pre-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KirinDL-Pre-Release-${{ steps.version.outputs.dev_tag }}-${{ github.run_number }}
          path: |
            artifacts/prerelease/KirinDL-Universal-Pre-Release.apk
            artifacts/prerelease/KirinDL-Universal-Pre-Release.apk.sha256
            artifacts/prerelease/KirinDL-ARM64-Pre-Release.apk
            artifacts/prerelease/KirinDL-ARM64-Pre-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish Kirin Pre-Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: ${{ steps.version.outputs.dev_tag }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail
          RELEASE_TITLE="KirinDL ${DEV_TAG#v} Pre-Release"
          NOTES_FILE="$RUNNER_TEMP/kirindl-prerelease-notes.md"

          cat > "$NOTES_FILE" <<EOF_NOTES
          ## Kirin Pre-Release

          Automatically generated test build for the next KirinDL stable patch.

          - Target stable version: \`$BASE_VERSION\`
          - Tag: \`$DEV_TAG\`
          - Commit: \`$GITHUB_SHA\`
          - Workflow run: \`#$GITHUB_RUN_NUMBER\`
          - Android package: \`com.kirin.downloader.prerelease\`
          - Stable package remains: \`com.kirin.downloader\`
          - Can be installed beside Stable on the same phone.
          - **ARM64** is the smaller build for normal modern ARM64 phones.
          - **Universal** contains all supported ABIs and is larger.
          - Both APKs are signed and verified with Android apksigner.

          > Every Pre-Release workflow run automatically advances the DevPatch number for the next stable patch.
          EOF_NOTES

          gh release create "$DEV_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            artifacts/prerelease/KirinDL-Universal-Pre-Release.apk \
            artifacts/prerelease/KirinDL-Universal-Pre-Release.apk.sha256 \
            artifacts/prerelease/KirinDL-ARM64-Pre-Release.apk \
            artifacts/prerelease/KirinDL-ARM64-Pre-Release.apk.sha256

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/kirin-release.jks"
          rm -f "$GITHUB_WORKSPACE/keystore.properties"
