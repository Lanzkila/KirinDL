name: Kirin Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build generic release
        run: ./gradlew assembleGenericRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Show generated APKs
        run: find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KirinDownloader-test-${{ github.run_number }}
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 14
