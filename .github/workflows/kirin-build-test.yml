name: Kirin Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug ARM64
        run: ./gradlew assembleGenericDebug -PnoSplits -PABI_FILTERS=arm64-v8a --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          if [[ -n "$KIRIN_KEYSTORE_BASE64" && -n "$KIRIN_KEYSTORE_PASSWORD" && -n "$KIRIN_KEY_ALIAS" && -n "$KIRIN_KEY_PASSWORD" ]]; then
            printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
            cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          keyAlias=$KIRIN_KEY_ALIAS
          keyPassword=$KIRIN_KEY_PASSWORD
          storeFile=../kirin-release.jks
          storePassword=$KIRIN_KEYSTORE_PASSWORD
          EOF
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; debug test build will still be uploaded."
          fi

      - name: Build signed release ARM64
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew assembleGenericRelease -PnoSplits -PABI_FILTERS=arm64-v8a --stacktrace --no-daemon --no-configuration-cache

      - name: Show generated APKs
        run: find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KirinDownloader-debug-arm64-${{ github.run_number }}
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KirinDownloader-release-arm64-${{ github.run_number }}
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 30
