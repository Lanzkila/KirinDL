name: Kirin Build Test

on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Dev release tag (example: v3.1.3-devpatch1)"
        required: true
        default: "v3.1.3-devpatch1"
        type: string

permissions:
  contents: write

concurrency:
  group: kirindl-build-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build stable-signed Universal Debug
        run: ./gradlew assembleGenericDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare KirinDL release signing
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KIRIN_KEYSTORE_BASE64 KIRIN_KEYSTORE_PASSWORD KIRIN_KEY_ALIAS KIRIN_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done

          printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/kirin-release.jks"

          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n' \
            "$KIRIN_KEY_ALIAS" "$KIRIN_KEY_PASSWORD" "$KIRIN_KEYSTORE_PASSWORD" \
            > "$GITHUB_WORKSPACE/keystore.properties"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/kirin-release.jks" \
            -storepass "$KIRIN_KEYSTORE_PASSWORD" \
            -alias "$KIRIN_KEY_ALIAS" >/dev/null

          echo "KirinDL release keystore is valid."

      - name: Build signed Universal Release
        run: ./gradlew assembleGenericRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Locate Universal APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/generic/debug -type f -name '*universal*.apk' | head -n 1)"
          RELEASE_APK="$(find app/build/outputs/apk/generic/release -type f -name '*universal*.apk' | head -n 1)"

          [[ -n "$DEBUG_APK" ]] || { echo "::error::Universal debug APK was not generated."; exit 1; }
          [[ -n "$RELEASE_APK" ]] || { echo "::error::Universal release APK was not generated."; exit 1; }

          mkdir -p artifacts/debug artifacts/release
          cp "$DEBUG_APK" artifacts/debug/KirinDL-Universal-Debug.apk
          cp "$RELEASE_APK" artifacts/release/KirinDL-Universal-Release.apk

      - name: Verify Universal Release signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs \
            artifacts/release/KirinDL-Universal-Release.apk

      - name: Generate Universal Release SHA256
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts/release
            sha256sum KirinDL-Universal-Release.apk > KirinDL-Universal-Release.apk.sha256
          )

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KirinDL-Universal-Debug-${{ github.run_number }}
          path: artifacts/debug/KirinDL-Universal-Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KirinDL-Universal-Release-${{ github.run_number }}
          path: |
            artifacts/release/KirinDL-Universal-Release.apk
            artifacts/release/KirinDL-Universal-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish DevPatch prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$DEV_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-devpatch[0-9]+$ ]]; then
            echo "::error::Invalid dev tag '$DEV_TAG'. Expected format: v3.1.3-devpatch1"
            exit 1
          fi

          RELEASE_TITLE="KirinDL ${DEV_TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/kirindl-dev-release-notes.md"

          cat > "$NOTES_FILE" <<EOF
          ## Kirin Build Test

          Development prerelease generated automatically after a successful Kirin Build Test.

          - Tag: \`$DEV_TAG\`
          - Commit: \`$GITHUB_SHA\`
          - Workflow run: \`#$GITHUB_RUN_NUMBER\`
          - Signed Universal Release APK verified with Android apksigner.
          - Debug APK is included for testing only.

          > Development build. This is not the stable KirinDL release.
          EOF

          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            echo "Updating existing prerelease $DEV_TAG"
            gh release edit "$DEV_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          else
            echo "Creating prerelease $DEV_TAG"
            gh release create "$DEV_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

          gh release upload "$DEV_TAG" \
            artifacts/release/KirinDL-Universal-Release.apk \
            artifacts/release/KirinDL-Universal-Release.apk.sha256 \
            artifacts/debug/KirinDL-Universal-Debug.apk \
            --clobber

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/kirin-release.jks"
          rm -f "$GITHUB_WORKSPACE/keystore.properties"
