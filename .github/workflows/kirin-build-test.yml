name: Kirin Pre-Release

on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Pre-release tag (example: v3.1.3-devpatch10)"
        required: true
        default: "v3.1.8-devpatch20"
        type: string

permissions:
  contents: write

concurrency:
  group: kirindl-pre-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Kirin Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 still defaults to the removed legacy `tools` package.
          # Request only platform-tools; command-line tools are provided by the action.
          packages: "platform-tools"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate pre-release tag
        shell: bash
        env:
          DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$DEV_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-devpatch[0-9]+$ ]]; then
            echo "::error::Invalid pre-release tag '$DEV_TAG'. Expected format: v3.1.8-devpatch20"
            exit 1
          fi

      - name: Prepare KirinDL release signing
        shell: bash
        env:
          KIRIN_KEYSTORE_BASE64: ${{ secrets.KIRIN_KEYSTORE_BASE64 }}
          KIRIN_KEYSTORE_PASSWORD: ${{ secrets.KIRIN_KEYSTORE_PASSWORD }}
          KIRIN_KEY_ALIAS: ${{ secrets.KIRIN_KEY_ALIAS }}
          KIRIN_KEY_PASSWORD: ${{ secrets.KIRIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KIRIN_KEYSTORE_BASE64 KIRIN_KEYSTORE_PASSWORD KIRIN_KEY_ALIAS KIRIN_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Actions secrets."
              exit 1
            fi
          done

          printf '%s' "$KIRIN_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kirin-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/kirin-release.jks"

          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=../kirin-release.jks\nstorePassword=%s\n' \
            "$KIRIN_KEY_ALIAS" "$KIRIN_KEY_PASSWORD" "$KIRIN_KEYSTORE_PASSWORD" \
            > "$GITHUB_WORKSPACE/keystore.properties"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/kirin-release.jks" \
            -storepass "$KIRIN_KEYSTORE_PASSWORD" \
            -alias "$KIRIN_KEY_ALIAS" >/dev/null

          echo "KirinDL release keystore is valid."

      - name: Build signed Kirin Pre-Release
        shell: bash
        env:
          DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -euo pipefail
          PRERELEASE_SUFFIX="-${DEV_TAG##*-}"
          ./gradlew assembleGenericRelease \
            "-PkirinPrereleaseSuffix=$PRERELEASE_SUFFIX" \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Locate Universal Pre-Release APK
        shell: bash
        run: |
          set -euo pipefail

          PRERELEASE_APK="$(find app/build/outputs/apk/generic/release -type f -name '*universal*.apk' | head -n 1)"
          [[ -n "$PRERELEASE_APK" ]] || {
            echo "::error::Universal Kirin Pre-Release APK was not generated."
            exit 1
          }

          mkdir -p artifacts/prerelease
          cp "$PRERELEASE_APK" artifacts/prerelease/KirinDL-Pre-Release.apk

      - name: Verify package identity and signature
        shell: bash
        env:
          DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          APK="artifacts/prerelease/KirinDL-Pre-Release.apk"
          BADGING="$("$AAPT" dump badging "$APK")"

          PACKAGE_ID="$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          APP_LABEL="$(printf '%s\n' "$BADGING" | sed -n "s/application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
          EXPECTED_VERSION="${DEV_TAG#v}"

          if [[ "$PACKAGE_ID" != "com.kirin.downloader.prerelease" ]]; then
            echo "::error::Wrong package id: '$PACKAGE_ID'. Expected com.kirin.downloader.prerelease"
            exit 1
          fi

          if [[ "$VERSION_NAME" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Wrong version name: '$VERSION_NAME'. Expected '$EXPECTED_VERSION'"
            exit 1
          fi

          if [[ "$APP_LABEL" != "Kirin Pre-Release" ]]; then
            echo "::error::Wrong app label: '$APP_LABEL'. Expected 'Kirin Pre-Release'"
            exit 1
          fi

          if printf '%s\n' "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::Pre-Release APK is debuggable. Refusing to publish a debug-style APK."
            exit 1
          fi

          EXPECTED_CERT_SHA256="793680d2b313b0806e195e29d2fe5d882a263220028450e7e88e48ffa32d0a98"
          APKSIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$APKSIGNER_OUTPUT"

          CERT_SHA256="$(printf '%s\n' "$APKSIGNER_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [[ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Wrong signing certificate: '$CERT_SHA256'"
            exit 1
          fi

          echo "Verified package: $PACKAGE_ID"
          echo "Verified version: $VERSION_NAME"
          echo "Verified label: $APP_LABEL"
          echo "Verified build type: release/non-debuggable"
          echo "Verified release signing certificate SHA-256: $CERT_SHA256"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts/prerelease
            sha256sum KirinDL-Pre-Release.apk > KirinDL-Pre-Release.apk.sha256
          )

      - name: Upload Kirin Pre-Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirinDL-Pre-Release-${{ inputs.dev_tag }}-${{ github.run_number }}
          path: |
            artifacts/prerelease/KirinDL-Pre-Release.apk
            artifacts/prerelease/KirinDL-Pre-Release.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Kirin Pre-Release notes
        shell: bash
        env:
          DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/kirindl-prerelease-notes.md"

          cat > "$NOTES_FILE" <<EOF_NOTES
          ## Kirin Pre-Release

          Test build generated automatically after a successful Kirin Pre-Release workflow.

          - Tag: $DEV_TAG
          - Commit: $GITHUB_SHA
          - Workflow run: #$GITHUB_RUN_NUMBER
          - Android package: com.kirin.downloader.prerelease
          - Stable package remains: com.kirin.downloader
          - The Pre-Release APK can be installed beside Stable on the same phone.
          - Built with the same Android Release build type used by Stable; only package/version/label are overridden for testing.
          - APK is verified non-debuggable and signed with the original KirinDL release certificate.

          > Test build only. Installing this APK does not replace the Stable KirinDL app.
          EOF_NOTES

      - name: Publish Kirin Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.dev_tag }}
          name: KirinDL ${{ inputs.dev_tag }} Pre-Release
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: ${{ runner.temp }}/kirindl-prerelease-notes.md
          files: |
            artifacts/prerelease/KirinDL-Pre-Release.apk
            artifacts/prerelease/KirinDL-Pre-Release.apk.sha256

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/kirin-release.jks"
          rm -f "$GITHUB_WORKSPACE/keystore.properties"
